name: Publish Koog

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: "Base version. Releases use the version in gradle.properties."
        required: true
        default: "1.3.0"
      group_id:
        description: "Maven groupId for the fork."
        required: true
        default: "moe.tlaster.koog"
      repository_url:
        description: "Central Portal snapshot repository URL."
        required: true
        default: "https://central.sonatype.com/repository/maven-snapshots/"
      openai_client_only:
        description: "Publish only the OpenAI client module and all its platform variants."
        type: boolean
        default: false
      release:
        description: "Publish a stable version of all modules to Maven Central."
        type: boolean
        default: false

concurrency:
  group: publish-koog-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: "corretto"
  JAVA_OPTS: "-Xms8g -Xmx8g -Dfile.encoding=UTF-8 -Djava.awt.headless=true -Dkotlin.daemon.jvm.options=-Xmx6g"

jobs:
  publish:
    name: Publish ${{ inputs.group_id }}:${{ inputs.base_version }} (${{ inputs.release && 'release' || 'snapshot' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ORG_GRADLE_PROJECT_group: ${{ inputs.group_id }}
      ORG_GRADLE_PROJECT_version: ${{ inputs.base_version }}
      ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
      ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}
      SNAPSHOT_REPOSITORY_URL: ${{ inputs.repository_url }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Configure Git
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Validate publishing inputs
        env:
          BASE_VERSION: ${{ inputs.base_version }}
          GROUP_ID: ${{ inputs.group_id }}
          PUBLISH_RELEASE: ${{ inputs.release }}
          OPENAI_CLIENT_ONLY: ${{ inputs.openai_client_only }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "$GROUP_ID" != "moe.tlaster.koog" ]]; then
            echo "This workflow publishes under groupId moe.tlaster.koog." >&2
            exit 1
          fi

          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
               [[ "$BASE_VERSION" != "$(sed -n 's/^version=//p' gradle.properties)" ]]; then
              echo "A release requires the stable version from gradle.properties." >&2
              exit 1
            fi
            if [[ "$OPENAI_CLIENT_ONLY" == "true" ]]; then
              echo "A release publishes all modules." >&2
              exit 1
            fi
          elif [[ "$BASE_VERSION" == *-SNAPSHOT ]]; then
            echo "base_version must not include -SNAPSHOT because the Gradle build appends it." >&2
            exit 1
          fi

          for name in OSSRH_USERNAME OSSRH_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Publish snapshots
        if: ${{ !inputs.release }}
        env:
          OPENAI_CLIENT_ONLY: ${{ inputs.openai_client_only }}
        run: |
          publish_args=(publishAllSnapshotsToCentralPortal)
          if [[ "$OPENAI_CLIENT_ONLY" == "true" ]]; then
            publish_args=(
              :prompt:prompt-executor:prompt-executor-clients:prompt-executor-openai-client:publishAllPublicationsToCentralPortalSnapshotsRepository
              --max-workers=1
            )
          fi
          ./gradlew \
            --init-script .github/gradle/publish-snapshot.init.gradle.kts \
            "${publish_args[@]}" \
            --no-daemon \
            --stacktrace

      - name: Publish signed release to Maven Central
        if: ${{ inputs.release }}
        env:
          BRANCH_KOOG_IS_RELEASING_FROM: ${{ inputs.base_version }}
          CE_MVN_CLIENT_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CE_MVN_CLIENT_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :publishMavenToCentralPortal

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publish-snapshot-reports
          path: |
            **/build/reports/
